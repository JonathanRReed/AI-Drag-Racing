name: Verify

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Scripts such as build:pages and test:bun-check run under node, so use the pinned LTS.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.4'
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Audit dependencies
        run: bun run audit:dependencies
      - name: Lint
        run: bun run lint
      - name: Bun type-check guard tests
        run: bun run test:bun-check
      - name: Typecheck
        run: bun run typecheck
      - name: Test
        run: bun run test

      - name: Build Cloudflare artifact
        run: bun run build:pages
      - name: Preserve unfiltered audit and runtime evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-audit-${{ github.sha }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
          path: |
            .cache/dependency-audit/
            .next/dependency-audit/
